# Publishes a Windows installer (and portable exe) to GitHub Releases. Installed copies of PixelForge
# find the new version through Help ▸ Check for Updates… (electron-updater reads latest.yml from the release).
#
#   1. bump "version" in package.json, commit
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The release is created as a hidden draft *before* electron-builder runs. electron-builder publishes each target
# (installer, portable) separately; if no release exists yet they race and each create one, splitting the files
# across duplicate releases that share a tag. With the draft already there, every upload lands in it. The draft is
# only published once all the files are attached, so nobody (and no updater) ever sees a half-uploaded release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$v" ] || { echo "::error::tag $TAG does not match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Create draft release
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 0; fi
          gh release create "$TAG" --draft --verify-tag --title "PixelForge ${TAG#v}" --generate-notes
      - run: npx electron-builder --win --publish always
      - name: Check every file was uploaded, then publish
        shell: bash
        run: |
          v=${TAG#v}
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          for f in latest.yml "PixelForge-Setup-$v.exe" "PixelForge-Setup-$v.exe.blockmap" "PixelForge-Portable-$v.exe"; do
            grep -qxF "$f" <<< "$assets" || { echo "::error::$f is missing from release $TAG (left as a draft)"; exit 1; }
          done
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q "[.[] | select(.tag_name == \"$TAG\")] | length" | awk '{s+=$1} END {print s}')
          [ "$n" = 1 ] || { echo "::error::$n releases share tag $TAG; delete the extras"; exit 1; }
          gh release edit "$TAG" --draft=false --latest
