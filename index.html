<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelForge</title>
</head>
<body>
  <div id="app">
    <div id="menubar"></div>
    <div id="dock-top"><div id="options"></div></div>
    <div id="main">
      <div id="dock-left"><div id="toolbar"></div></div>
      <div id="center">
        <div id="tabs"></div>
        <div id="stage"></div>
      </div>
      <aside id="panels">
        <section id="layerpanel"></section>
        <section id="historypanel"></section>
      </aside>
      <div id="dock-right"></div>
    </div>
    <div id="dock-bottom"></div>
    <div id="status"></div>
  </div>
  <div id="toast"></div>
  <div id="dropzone">Drop images or PSD files to open</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
